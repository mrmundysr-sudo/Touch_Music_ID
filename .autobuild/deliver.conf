# APK delivery configuration (standard: autobuild/APK-DELIVERY.md in mrmundysr-sudo/touch-development).
# Debug builds add the ".debug" applicationIdSuffix, so the delivered APK's package is APP_ID below.
PROJECT_DIR=.
APP_ID=com.mundymorning.touchmusicid.debug
MODULE=app
VARIANT=Debug
GRADLE_VERSION=8.10.2
CI_ARTIFACT_PATTERN=Touch-Music-ID-debug-{run}
