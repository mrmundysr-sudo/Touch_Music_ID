# Runs the JVM unit tests (state machine, Wikipedia parsing, cache, Room persistence via Robolectric, links).
name: Unit tests (dev branches)

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: ./gradlew --no-daemon testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
