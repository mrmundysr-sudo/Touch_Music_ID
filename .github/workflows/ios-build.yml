name: iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - grok/ios-testflight
      - 'claude/**'

jobs:
  core-tests:
    # Unit tests for the Foundation-only Core layer (Wikipedia/Wikidata knowledge, lyrics, links, library).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run Core unit tests
        run: swift test

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build for iOS Simulator (no signing)
        run: |
          xcodebuild \
            -project TouchMusicID.xcodeproj \
            -scheme TouchMusicID \
            -destination 'generic/platform=iOS Simulator' \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
