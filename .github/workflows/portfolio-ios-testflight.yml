name: Portfolio iOS TestFlight Launcher

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Repository owner/name"
        required: true
        type: string
      source_ref:
        description: "Branch or commit"
        required: true
        type: string
      bundle_id:
        description: "iOS bundle identifier"
        required: true
        type: string
      app_name:
        description: "App name"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: portfolio-ios-${{ inputs.bundle_id }}
  cancel-in-progress: true
env:
  TEAM_ID: 2M956232BT
  MARKETING_VERSION: "1.0"
jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Check out requested app
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          path: app-source
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate iOS project
        working-directory: app-source
        run: |
          npm install
          npm test
          npx cap add ios
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install pillow
          npx cap sync ios
          if [ -f tools/patch_ios.py ]; then "$RUNNER_TEMP/venv/bin/python" tools/patch_ios.py; fi
      - name: Write signing key
        env:
          API_PRIVATE_KEY: ${{ secrets.APPLE_SIGNING_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_SIGNING_KEY_ID }}
        run: |
          test -n "$API_PRIVATE_KEY" || exit 1
          test -n "$API_KEY_ID" || exit 1
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$API_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8"
          echo "API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: Create export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOT
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>signingStyle</key><string>automatic</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>destination</key><string>export</string>
          <key>uploadSymbols</key><true/>
          </dict></plist>
          EOT
      - name: Archive
        working-directory: app-source/ios/App
        run: |
          xcodebuild archive -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM=$TEAM_ID PRODUCT_BUNDLE_IDENTIFIER="${{ inputs.bundle_id }}" MARKETING_VERSION=$MARKETING_VERSION CURRENT_PROJECT_VERSION=${{ github.run_number }} TARGETED_DEVICE_FAMILY=1
      - name: Export IPA
        env:
          API_KEY_ID: ${{ secrets.APPLE_SIGNING_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_SIGNING_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates -authenticationKeyPath "$API_KEY_PATH" -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
      - name: Check out TestFlight metadata helper
        uses: actions/checkout@v4
        with:
          repository: Apple-Actions/upload-testflight-build
          ref: 665328adbecbc3ad929d3da710696d928b8a7ba9
          path: testflight-helper
          persist-credentials: false
      - name: Populate TestFlight Test Information
        env:
          API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          test -n "$API_PRIVATE_KEY" || exit 1
          test -n "$API_KEY_ID" || exit 1
          test -n "$ISSUER_ID" || exit 1
          key_path="$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8"
          printf '%s' "$API_PRIVATE_KEY" > "$key_path"
          trap 'rm -f "$key_path"' EXIT
          ./testflight-helper/scripts/populate-test-information.sh \
            --dir app-source \
            --apply \
            --issuer-id "$ISSUER_ID" \
            --api-key-id "$API_KEY_ID" \
            --api-private-key-path "$key_path"
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ runner.temp }}/export/App.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: "false"
          wait-for-processing: "true"
      - name: Report
        run: echo "Processed ${{ inputs.app_name }} build ${{ github.run_number }}"
