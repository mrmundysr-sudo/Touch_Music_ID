name: Portfolio iOS TestFlight Launcher

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Repository owner/name"
        required: true
        type: string
      source_ref:
        description: "Branch or commit"
        required: true
        type: string
      bundle_id:
        description: "iOS bundle identifier"
        required: true
        type: string
      app_name:
        description: "App name"
        required: true
        type: string
      ios_project:
        description: "Native Xcode project path; leave blank for Capacitor apps"
        required: false
        type: string
        default: ""
      ios_scheme:
        description: "Native Xcode scheme (required when ios_project is set)"
        required: false
        type: string
        default: ""
      marketing_version:
        description: "App version for native Xcode projects"
        required: false
        type: string
        default: "1.0"
      build_number:
        description: "Build number for native Xcode projects"
        required: false
        type: string
        default: "1"
permissions:
  contents: read
concurrency:
  group: portfolio-ios-${{ inputs.bundle_id }}
  cancel-in-progress: true
env:
  TEAM_ID: 2M956232BT
jobs:
  build-and-upload:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Check out requested app
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          path: app-source

      - uses: actions/setup-node@v4
        if: ${{ inputs.ios_project == '' }}
        with:
          node-version: "20"

      - name: Generate iOS project
        if: ${{ inputs.ios_project == '' }}
        working-directory: app-source
        run: |
          npm install
          npm test
          npx cap add ios
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install pillow
          npx cap sync ios
          if [ -f tools/patch_ios.py ]; then "$RUNNER_TEMP/venv/bin/python" tools/patch_ios.py; fi

      - name: Write signing key
        env:
          API_PRIVATE_KEY: ${{ secrets.APPLE_SIGNING_PRIVATE_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_SIGNING_KEY_ID }}
        run: |
          test -n "$API_PRIVATE_KEY" || exit 1
          test -n "$API_KEY_ID" || exit 1
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$API_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8"
          echo "API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Create export options
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOT
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>signingStyle</key><string>automatic</string>
          <key>teamID</key><string>$TEAM_ID</string>
          <key>destination</key><string>export</string>
          <key>uploadSymbols</key><true/>
          </dict></plist>
          EOT

      - name: Apply App Store bundle ID to native project
        if: ${{ inputs.ios_project != '' }}
        working-directory: app-source
        env:
          IOS_BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          test -f ios/project.yml || true
          if [ -f ios/project.yml ]; then
            sed -i.bak "s/com.mundymorning.touchweathertracker/$IOS_BUNDLE_ID/g" ios/project.yml
          fi

      - name: Generate XcodeGen project when needed
        if: ${{ inputs.ios_project != '' }}
        working-directory: app-source
        env:
          IOS_PROJECT: ${{ inputs.ios_project }}
        run: |
          if [ ! -f "$IOS_PROJECT/project.pbxproj" ]; then
            PROJECT_DIR="$(dirname "$IOS_PROJECT")"
            if [ -f "$PROJECT_DIR/project.yml" ]; then
              brew install xcodegen
              (cd "$PROJECT_DIR" && xcodegen generate)
            fi
          fi

      - name: Archive native Xcode project
        if: ${{ inputs.ios_project != '' }}
        working-directory: app-source
        env:
          IOS_PROJECT: ${{ inputs.ios_project }}
          IOS_SCHEME: ${{ inputs.ios_scheme }}
          APP_VERSION: ${{ inputs.marketing_version }}
          APP_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          test -n "$IOS_SCHEME" || { echo "ios_scheme is required when ios_project is set"; exit 1; }
          test -f "$IOS_PROJECT/project.pbxproj" || { echo "Xcode project not found: $IOS_PROJECT"; exit 1; }
          [[ "$APP_BUILD_NUMBER" =~ ^[0-9]+$ ]] || { echo "build_number must contain digits only"; exit 1; }
          xcodebuild archive -project "$IOS_PROJECT" -scheme "$IOS_SCHEME" -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES DEVELOPMENT_TEAM="$TEAM_ID" MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD_NUMBER" TARGETED_DEVICE_FAMILY=1

      - name: Archive Capacitor project
        if: ${{ inputs.ios_project == '' }}
        working-directory: app-source/ios/App
        run: |
          # capacitor.config.json supplies the App target bundle ID. Do not pass
          # PRODUCT_BUNDLE_IDENTIFIER globally: that would also overwrite nested
          # framework/resource targets and can create duplicate bundle IDs.
          xcodebuild archive -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM="$TEAM_ID" MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION=${{ github.run_number }} TARGETED_DEVICE_FAMILY=1

      - name: Export IPA
        env:
          API_KEY_ID: ${{ secrets.APPLE_SIGNING_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_SIGNING_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates -authenticationKeyPath "$API_KEY_PATH" -authenticationKeyID "$API_KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
          IPA_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH" || { echo "Xcode export produced no IPA"; exit 1; }
          echo "UPLOAD_IPA=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ env.UPLOAD_IPA }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: "false"
          wait-for-processing: "true"

      - name: Report
        run: echo "Processed ${{ inputs.app_name }} version ${{ inputs.marketing_version }} build ${{ inputs.build_number }}"
