# Touch AutoBuild (self-contained variant for this PUBLIC repository).
# The shared hub workflow (mrmundysr-sudo/touch-development) lives in a PRIVATE repo, and GitHub does not let a public
# repository call a reusable workflow from a private one, so this repo builds with its own steps.
# Builds every claude/** branch push and manual dispatch. Never publishes a release.
name: AutoBuild (dev branches)

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autobuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept SDK licenses and install platform
        run: |
          SDKM="$(command -v sdkmanager || find "$ANDROID_HOME" -name sdkmanager -type f | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0" > /dev/null
      - name: Place ShazamKit AAR (git-ignored)
        run: .github/scripts/fetch-shazamkit.sh
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

  token-service:
    name: Token service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
        working-directory: backend/token-service

  live-wiki:
    name: Live Wikipedia/Wikidata smoke (informational)
    runs-on: ubuntu-latest
    continue-on-error: true   # real network; reports real-API behaviour without blocking the APK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept SDK licenses and install platform
        run: |
          SDKM="$(command -v sdkmanager || find "$ANDROID_HOME" -name sdkmanager -type f | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0" > /dev/null
      - name: Run live smoke test
        shell: bash
        run: |
          set -o pipefail
          LIVE_WIKI=1 ./gradlew --no-daemon testDebugUnitTest --tests '*LiveWikiSmokeTest*' -i 2>&1 | tee live.log
          { echo '### Live Wikipedia/Wikidata smoke test'; echo '```'; grep 'LIVE-WIKI' live.log || echo '(no output)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-wiki-log-${{ github.run_number }}
          path: live.log
          if-no-files-found: ignore

  lookup-diagnostics:
    name: Lookup diagnostics (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept SDK licenses and install platform
        run: |
          SDKM="$(command -v sdkmanager || find "$ANDROID_HOME" -name sdkmanager -type f | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0" > /dev/null
      - name: Trace artists through the live lookup and characterise failure handling
        shell: bash
        run: |
          set -o pipefail
          LIVE_DIAG=1 ./gradlew --no-daemon testDebugUnitTest --tests '*LookupDiagnosticsLiveTest*' --tests '*LookupFailureCharacterizationTest*' -i 2>&1 | tee diag.log || true
          {
            echo '### Live lookup summary'; echo '```'; grep -h 'DIAGSUM' diag.log | sed 's/^ *//' || echo '(none)'; echo '```'
            echo '### Failure-handling characterisation'; echo '```'; grep -h 'DIAGCHAR' diag.log | sed 's/^ *//' || echo '(none)'; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E 'tests completed|FAILED|BUILD' diag.log | tail -5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lookup-diagnostics-${{ github.run_number }}
          path: diag.log
          if-no-files-found: ignore

  build:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept SDK licenses and install platform
        run: |
          SDKM="$(command -v sdkmanager || find "$ANDROID_HOME" -name sdkmanager -type f | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0" > /dev/null
      - name: Place ShazamKit AAR (git-ignored)
        run: .github/scripts/fetch-shazamkit.sh
      - name: Assemble debug APK
        env:
          # Public endpoint address, not a credential. The repo variable overrides the default if one is set.
          TOKEN_SERVICE_URL: ${{ vars.TOKEN_SERVICE_URL || 'https://touch-music-id-token.mrmundysr.workers.dev/shazam-token' }}
        run: ./gradlew --no-daemon assembleDebug -PTOKEN_SERVICE_URL="$TOKEN_SERVICE_URL"
      - name: Verify what was built in (SDK linked, token URL set)
        run: |
          f="$(find app/build/generated -name BuildConfig.java -path '*debug*' | head -1)"
          echo "BuildConfig: $f"
          grep -E 'SHAZAMKIT_LINKED|TOKEN_SERVICE_URL' "$f" | tee bc.txt
          grep -q 'SHAZAMKIT_LINKED = true' bc.txt || { echo "::error::ShazamKit AAR was not linked"; exit 1; }
          grep -q 'TOKEN_SERVICE_URL = "https://.*/shazam-token"' bc.txt || { echo "::error::Token URL missing or malformed"; exit 1; }
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/arm64-v8a/.*(shazam|sig)' | head -3 || true
          { echo '### Built-in configuration'; echo '```'; cat bc.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Live token endpoint check (shape only, token never printed)
        continue-on-error: true
        env:
          TOKEN_SERVICE_URL: ${{ vars.TOKEN_SERVICE_URL || 'https://touch-music-id-token.mrmundysr.workers.dev/shazam-token' }}
        run: |
          resp="$(curl -sS -m 30 -w '\n%{http_code}' "$TOKEN_SERVICE_URL")"
          code="${resp##*$'\n'}"; json="${resp%$'\n'*}"
          tok="$(printf '%s' "$json" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))' 2>/dev/null || true)"
          [ -n "$tok" ] && echo "::add-mask::$tok"
          TOK="$tok" CODE="$code" python3 - <<'PY' | tee live.txt
          import os,json,base64,time
          t=os.environ["TOK"]; print("HTTP", os.environ["CODE"])
          if t.count(".")==2:
              d=lambda x: json.loads(base64.urlsafe_b64decode(x+"="*(-len(x)%4)))
              h,c,s=t.split(".")
              print("header",d(h)); cl=d(c); print("claims",cl); print("sig bytes",len(base64.urlsafe_b64decode(s+"="*(-len(s)%4))))
              print("seconds until expiry",cl["exp"]-int(time.time()))
          else: print("no JWT in response")
          PY
          { echo '### Live token endpoint (token redacted)'; echo '```'; cat live.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Name and describe the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/Touch-Music-ID-debug-${{ github.run_number }}.apk"
          sha256sum out/*.apk | tee out/SHA256SUMS.txt
          {
            echo "### Touch Music ID debug APK (CI build)"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- SHA-256: \`$(sha256sum out/*.apk | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Touch-Music-ID-debug-${{ github.run_number }}
          path: out/
          retention-days: 30
